name: PHP Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The plugin registers its block from the build directory, which isn't
    # committed. Build it once and share it with each PHPUnit job.
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm

    - name: npm install
      run: npm ci

    - name: Build
      run: npm run build

    - name: Upload build
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: build
        path: build/
        if-no-files-found: error
        retention-days: 1

  build-matrix:
    name: Build WP/PHP Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        name: Generate matrix JSON
        shell: bash
        run: |
          declare -A wp_php
          wp_php["trunk"]="8.0 8.1 8.2 8.3 8.4 8.5 8.6"
          wp_php["7.1"]="8.0 8.1 8.2 8.3 8.4 8.5"
          wp_php["7.0"]="8.0 8.1 8.2 8.3 8.4 8.5"

          matrix='{"include":[]}'
          mapfile -t wp_versions < <(
            {
              printf '%s\n' "${!wp_php[@]}" | grep -x 'trunk' || true
              printf '%s\n' "${!wp_php[@]}" | grep -vx 'trunk' | sort -rV
            }
          )

          for wp_version in "${wp_versions[@]}"; do
            for php_version in ${wp_php[$wp_version]}; do
              matrix=$(jq \
                --arg wp "$wp_version" \
                --arg php "$php_version" \
                '.include += [{"wp-version": $wp, "php-version": $php}]' \
                <<< "$matrix")
            done
          done

          echo "matrix=$(jq -c . <<< "$matrix")" >> "$GITHUB_OUTPUT"

  phpunit:
    needs: [ 'build', 'build-matrix' ]
    name: WP ${{ matrix.wp-version }} / PHP ${{ matrix.php-version }}
    strategy:
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
      fail-fast: false
    uses: ./.github/workflows/phpunit-reusable.yaml
    with:
      wp-version: ${{ matrix.wp-version }}
      php-version: ${{ matrix.php-version }}

  required-status-checks:
    # This should be configured as the required status check in branch protection rules
    #
    # Using a summary job allows for easier management of the PHP Unit matrix as the
    # required status check will not need to be updated when matrix items change.
    name: PHPUnit Required Status Checks
    runs-on: 'ubuntu-24.04'
    needs: [ 'build', 'build-matrix', 'phpunit' ]
    if: ${{ always() }}
    steps:
      - name: Detect any failing status checks
        run: |
          [[ "${{ join(needs.*.result, ' ') }}" =~ ^(success ?)+$ ]] || exit 1
